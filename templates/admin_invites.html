{% extends "base.html" %}
{% block content %}

<div class="container">

  <p><a href="{{ url_for('admin') }}">← Back to admin</a></p>

  <h2>Invites: {{ conversation.title }}</h2>

  <table class="admin-table">
    <thead>
      <tr>
        <th>Username</th>
        <th>Added</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody>
      {% for inv in invites %}
      <tr>
        <td>{{ inv.mw_username }}</td>
        <td>{{ inv.created_at.strftime('%Y-%m-%d') }}</td>
        <td>
          <form method="post" action="{{ url_for('admin_invite_remove', conv_id=conversation.id, invite_id=inv.id) }}" style="display:inline">
            <button type="submit">Remove</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="3">No invites yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>

  <div class="edit-form" style="margin-top: 1.5rem;">
    <h3>Add invite</h3>
    <form method="post" action="{{ url_for('admin_invite_add', conv_id=conversation.id) }}">
      <label>Wikimedia username
        <input type="text" name="mw_username" placeholder="ExampleUser" required>
      </label>
      <button type="submit">Add</button>
    </form>
  </div>

</div>

{% endblock %}
