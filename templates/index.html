{% extends "base.html" %}
{% block content %}

<div class="container">

  {% if conversation.intro_text %}
  <div class="intro-text">
    {{ conversation.intro_text | safe }}
  </div>
  {% endif %}

  <div class="polis-wrapper">
    <div class="polis"
      data-conversation_id="{{ conversation.polis_id }}"
      data-xid="{{ xid }}"
      data-x_name="{{ username }}"
      data-ucst="false"
      data-ucsd="false"
      data-ucsh="false"
      data-ucsf="false"
      data-ucsv="false">
    </div>
    <script async src="https://pol.is/embed.js"></script>
  </div>

  {% if conversation.outro_text %}
  <div class="outro-text">
    {{ conversation.outro_text | safe }}
  </div>
  {% endif %}

</div>

{% endblock %}
