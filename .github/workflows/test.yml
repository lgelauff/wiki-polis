name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: v2/frontend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Generate API types and typecheck
        run: npm run typecheck

      - name: Component and contract tests
        run: npm test

      - name: Production build
        run: npm run build

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1

      - name: Install dependencies
        run: uv sync --locked

      - name: Verify deploy dependency snapshot
        run: |
          uv export --locked --no-dev --no-hashes --no-emit-project --no-header --no-annotate \
            --output-file /tmp/requirements-deploy.txt
          diff --unified requirements-deploy.txt /tmp/requirements-deploy.txt

      - name: Lint (ruff — pyflakes; catches undefined names / unused)
        run: uvx ruff check .

      - name: Tests
        # No .env in CI, and app.py instantiates the app at import, so the
        # production startup checks need these supplied. FLASK_DEBUG=1 bypasses
        # the web-server-only guards; the security tests override it per-test.
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SECRET_KEY: "0000000000000000000000000000000000000000"
          FLASK_DEBUG: "1"
        run: uv run pytest -q

  # Tier-1 pytest runs on SQLite, which does NOT enforce the FK/index, ENUM and
  # JSON DDL rules that Toolforge's MariaDB does — so a migration can pass CI yet
  # break `flask db upgrade` on deploy (e.g. err 1553, "cannot drop index needed
  # in a foreign key constraint"). This job runs the migration chain against real
  # MariaDB to catch that class of bug before staging.
  migrations-mariadb:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: wikipolis
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # migration-check.sh worktrees the base ref to build the pre-change schema
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Migrations apply on MariaDB (deploy DB engine)
        env:
          MIGCHECK_DB_URL: "mysql+pymysql://root:root@127.0.0.1:3306/wikipolis"
          # Pass via env (not inline ${{ }}) so a crafted branch name can't inject into the shell.
          BASE_REF: ${{ github.base_ref || 'main' }}
        run: bash migration-check.sh "origin/${BASE_REF}"

  embedding-sidecar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build CPU-only embedding image
        run: docker build --tag wiki-polis-embedding-sidecar:test v2/embedding_sidecar

      - name: Verify upgraded runtime imports
        run: >-
          docker run --rm wiki-polis-embedding-sidecar:test
          python -c "import fastapi, sentence_transformers, torch, uvicorn;
          assert not torch.cuda.is_available()"
