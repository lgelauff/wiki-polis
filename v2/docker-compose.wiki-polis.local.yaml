services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes: !override
      - "polis-schemas:/docker-entrypoint-initdb.d/"
      - "${PARTICIAPI_DIR}/particiapi/schema.sql:/docker-entrypoint-initdb.d/particiapi_schema.sql"
      # A named volume lets Postgres initialize ownership itself. Docker Desktop
      # on macOS cannot chown a fresh host bind mount here.
      - "polis-pgdata:/var/lib/postgresql"
      - "${WIKI_POLIS_DIR:?set WIKI_POLIS_DIR to the wiki-polis checkout}/v2/tmp/postgres-backups:/backups"
    mem_limit: 256m

  particiapi:
    environment:
      PARTICIAPI_AUTHENTICATION_DISABLED: "True"
      PARTICIAPI_CORS_ORIGINS: "http://127.0.0.1:${FLASK_HOST_PORT:-5001}"
      # Without this the local stack cannot exercise trusted-sub at all, so every
      # participant is anonymous and the identity paths degrade silently rather than
      # failing. That is how the Phase 6 identity binding reached production having
      # never run locally. Set PARTICIAPI_SUB_SECRET in v2/.env and the app and the
      # image share one secret; leave it unset and behaviour is exactly as before.
      #
      # The PARTICIAPI_ prefix is required, not cosmetic. The image reads its config
      # via Flask's from_prefixed_env(prefix="PARTICIAPI"), which strips the prefix —
      # so this lands as TRUSTED_SUB_SECRET in app.config. Passing the bare name is
      # silently discarded: the variable is visibly set inside the container, the
      # image has the feature, and nothing binds.
      PARTICIAPI_TRUSTED_SUB_SECRET: "${PARTICIAPI_SUB_SECRET:-}"
    ports: !override
      - "127.0.0.1:${PARTICIAPI_HOST_PORT:-8002}:5000"
    # Rootless Docker cannot set a container's UTS domainname: runc fails with
    # "open sysctl kernel.domainname file: permission denied" and particiapi never
    # starts. Nothing reads it locally (PARTICIAPI_SERVER_NAME is a separate env var).
    domainname: ""
    mem_limit: 256m

  polis-server:
    ports: !override
      - "127.0.0.1:${POLIS_HOST_PORT:-8003}:5000"
    mem_limit: 256m

  polis-file-server:
    mem_limit: 256m

  # Memory caps, from docker stats on hague (2026-09-22) over two full
  # simulate_cats_vs_dogs.py --phase6 runs: peak polis-math 1.0-1.25 GiB,
  # polis-server ~134 MiB, particiapi ~103, polis-file-server 41, postgres 36.
  # polis-math is a JVM whose heap does not shrink back after load and grows with
  # conversation size, so it gets 2g; the others fit well inside 256m.
  polis-math:
    mem_limit: 2g

volumes:
  polis-pgdata:
