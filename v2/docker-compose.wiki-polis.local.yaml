services:
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes: !override
      - "polis-schemas:/docker-entrypoint-initdb.d/"
      - "${PARTICIAPI_DIR}/particiapi/schema.sql:/docker-entrypoint-initdb.d/particiapi_schema.sql"
      - "${WIKI_POLIS_DIR:?set WIKI_POLIS_DIR to the wiki-polis checkout}/v2/tmp/postgresql:/var/lib/postgresql"
      - "${WIKI_POLIS_DIR:?set WIKI_POLIS_DIR to the wiki-polis checkout}/v2/tmp/postgres-backups:/backups"

  particiapi:
    environment:
      PARTICIAPI_AUTHENTICATION_DISABLED: "True"
      PARTICIAPI_CORS_ORIGINS: "http://127.0.0.1:${FLASK_HOST_PORT:-5001}"
    ports: !override
      - "127.0.0.1:${PARTICIAPI_HOST_PORT:-8002}:5000"

  polis-server:
    ports: !override
      - "127.0.0.1:${POLIS_HOST_PORT:-8003}:5000"
