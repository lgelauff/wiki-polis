# DRAFT translatewiki.net message-group config for Proto.
#
# This is NOT read by wiki-polis — it is a reference to hand to translatewiki.net (TWN) staff
# when requesting onboarding. TWN keeps the authoritative copy in their `translatewiki` config
# repo (group_yaml). Onboarding steps:
#   1. Confirm the repo LICENSE is OSS (TWN requirement — GPL-3.0, satisfied).
#   2. File a support request on translatewiki.net referencing this file.
#   3. TWN configures the group + the l10n sync bot, which commits translations back as
#      i18n/<code>.json (via PRs to the repo). Enable delivered locales via ENABLED_LOCALES.
#
# Docs: https://translatewiki.net/wiki/Translating:New_project

# NOTE: the group id is `proto` (the product name) while the repository is still
# named `wiki-polis` (see #289). The FILES paths below therefore keep `wiki-polis`, because
# they address the checkout directory, not the product. Flag this divergence in the support
# request so TWN does not "correct" one to match the other -- the id is frozen once
# translators start, the repo can still be renamed.
BASIC:
  id: proto
  label: Proto
  namespace: NS_TRANSLATIONS
  description: "Deliberation tool for the Wikimedia community (Toolforge)."
  sourcelanguage: en

FILES:
  class: JsonFFS
  codeMap:
    en-gb: en-GB
  sourcePattern: "%GROUPROOT%/wiki-polis/v2/i18n/%CODE%.json"
  targetPattern: "wiki-polis/v2/i18n/%CODE%.json"
  definitionFile: "%GROUPROOT%/wiki-polis/v2/i18n/en.json"

MANGLER:
  class: StringMatcher
  # Keys are already namespaced by surface (base-*, home-*, ...); no group prefix mangling.
  prefix: ""
  patterns: "*"

VALIDATORS:
  - id: BraceBalance
  - id: MediaWikiPlural
  - id: Printf

INSERTABLES:
  - class: FlatPluralInsertablesSuggester

# ── Held back from translators for now ──────────────────────────────────────
# The admin console is not ready to be translated: it needs product work first, and it is
# about a third of the catalogue's words while serving a handful of organisers per
# consultation. Holding it back is a configuration choice only — every key, call site and
# qqq entry stays exactly as it is, so releasing it later is deleting this list.
#
# A message reachable from a participant screen is NEVER listed here, even when the admin
# console also shows it: participants win a tie. That is why phase-label-* is absent (it
# renders in the participant scheduled-transition banner) while phase-route-* is present.
#
# Generated from the audience split in tests/test_i18n_audience.py, which fails if this
# list drifts. Do not hand-edit; re-run the test to see the expected contents.
#
# NOTE for translatewiki staff: please confirm TAGS: ignored: is the right mechanism for
# "not yet, but keep the messages" — the intent is that these are not offered for
# translation, not that they are permanently untranslatable.
