# Example nginx locations for the VPS reverse proxy. Keep Loki behind HTTPS
# basic auth because Toolforge ships Flask logs over the public internet.

location /grafana/ {
    proxy_pass http://127.0.0.1:3000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}

location /loki/ {
    auth_basic "wiki-polis logs";
    auth_basic_user_file /etc/nginx/wiki-polis-loki.htpasswd;

    proxy_pass http://127.0.0.1:3100/loki/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
}
