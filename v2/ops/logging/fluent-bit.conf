[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*
    Refresh_Interval  10
    Rotate_Wait       30
    Mem_Buf_Limit     20MB
    Skip_Long_Lines   On

# Docker wraps container stdout in a JSON object whose "log" field contains the
# application log line. Polis and wiki-polis already emit structured JSON there,
# so keep the original line and let Loki/Grafana parse it at query time.
[FILTER]
    Name    modify
    Match   docker.*
    Rename  log message

[OUTPUT]
    Name        loki
    Match       docker.*
    Host        loki
    Port        3100
    Labels      job=wiki-polis-vps
    Label_Keys  container_name
    Line_Format json
