; Canonical uWSGI config for the wiki-polis Toolforge webservice.
;
; RECORD OF TRUTH ONLY. Toolforge reads this from ~/www/python/uwsgi.ini on the
; tool, NOT from the repo, and deploy.sh does not copy it. To apply: copy this to
; ~/www/python/uwsgi.ini on the tool (and on wiki-polis-dev for staging), then
; `toolforge webservice restart`. See guide_deployment.md "Add uwsgi.ini".
;
; The [uwsgi] header is mandatory — without it uWSGI silently ignores the file.

[uwsgi]
; Wikimedia OAuth tokens exceed uWSGI's default 4 KB header buffer -> silent failures.
buffer-size = 65536

; Threaded workers. The app is I/O-bound: each request blocks on Particiapi / Polis
; Postgres, so threads (not just processes) are what clear concurrent voters. With
; the connection pools in place (a request spends its time waiting on I/O, holding a
; pooled connection, not CPU), processes x threads sets the in-flight ceiling.
;
; These are a STARTING POINT for ~1000 concurrent voters, to be tuned by the load
; test (synthetic_traffic.py). Reconcile processes x threads against:
;   - ToolsDB max_user_connections  (each thread may hold a SQLAlchemy connection:
;     processes x (TOOLSDB_POOL_SIZE + TOOLSDB_MAX_OVERFLOW), both default 10)
;   - the HTTP pool  (POLIS_HTTP_POOL_MAXSIZE, default 20 = threads)
;   - the Polis-PG pool  (POLIS_PG_POOL_MAXCONN, default 20 = threads)
;   - the Toolforge pod's memory limit (raise with `webservice --mem`)
enable-threads = true
processes = 4
threads = 20
